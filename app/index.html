<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fusion AI Studio Explorer</title>
<!-- A LinkedIn-style badge: rounded square, lowercase wordmark. Inline so the
     single-file bundle stays self-contained. rgb() rather than #0A66C2, because a
     bare '#' inside a data: URI starts a fragment and would truncate the SVG.
     textLength pins the wordmark to 50 of 64 units so four letters fit whatever
     sans the viewer actually has, and the baseline is set explicitly rather than
     with dominant-baseline, which favicon renderers honour inconsistently. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' ry='14' fill='rgb(10,102,194)'/%3E%3Ctext x='32' y='40' text-anchor='middle' textLength='50' lengthAdjust='spacingAndGlyphs' font-family='Helvetica,Arial,sans-serif' font-size='24' font-weight='700' fill='white'%3Ebaig%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script>
/* Applied before the first paint, so a viewer on a dark system who chose light
   does not get a dark flash while the 7 MB data.js parses. app.js owns the
   buttons and the canvas repaint; this only sets the attribute. */
try {
  var t = localStorage.getItem('fusion-explorer-theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) { /* private mode, blocked storage: fall through to the system theme */ }
</script>
</head>
<body>

<nav class="tabstrip" role="tablist">
  <button role="tab" data-tab="graph" aria-selected="true">Graph</button>
  <button role="tab" data-tab="lab" aria-selected="false">Data Lab</button>
  <a class="tablink" href="how-it-works.html">How it works</a>
  <span class="spacer"></span>
  <div class="theme" id="theme" role="group" aria-label="Colour theme">
    <button type="button" data-set-theme="auto" aria-pressed="true" title="Follow the system setting">Auto</button>
    <button type="button" data-set-theme="light" aria-pressed="false" title="Always light">Light</button>
    <button type="button" data-set-theme="dark" aria-pressed="false" title="Always dark">Dark</button>
  </div>
  <span class="build lbl" id="build"></span>
</nav>

<header>
  <div class="brand">
    <h1>Fusion AI Studio Explorer</h1>
    <span class="tag">Oracle Fusion AI Agent Studio &mdash; release-26C</span>
  </div>

  <div class="counts" id="counts"></div>

  <div class="controls">
    <label class="sel"><span>Color</span>
      <select id="color-by">
        <option value="community">Community</option>
        <option value="layer">Stack layer</option>
        <option value="type">Kind</option>
        <option value="family">Family</option>
        <option value="nodeType">Node type</option>
      </select>
    </label>
    <label class="sel"><span>Size</span>
      <select id="size-by">
        <option value="pagerank">PageRank</option>
        <option value="degree">Degree</option>
        <option value="betweenness">Betweenness</option>
        <option value="blastRadius">Blast radius</option>
        <option value="uniform">Uniform</option>
      </select>
    </label>
    <button class="search-open" id="search-open">Search artifacts… <kbd>⌘K</kbd></button>
  </div>
</header>

<!-- ------------------------------------------------------------- graph -->
<section id="graph">
  <!-- Phone only: the side panels become drawers, so their collapse toggles go
       off-screen with them. These stay put. -->
  <div class="mbar">
    <button type="button" id="m-left" aria-expanded="false">&#9776; Browse</button>
    <button type="button" id="m-right" aria-expanded="false">Details &rsaquo;</button>
  </div>
  <div class="drawer-scrim" id="drawer-scrim" hidden></div>

  <div class="graph-main">
    <aside class="side left" id="left-panel">
      <button class="panel-toggle" id="toggle-left" title="Collapse panel ([)" aria-expanded="true">‹</button>
      <div class="side-body" id="focus-panel"></div>
      <div class="rail-label">Browse</div>
    </aside>

    <div class="stage">
      <canvas id="cv"></canvas>

      <div class="stage-actions">
        <button id="zoom-out" class="touch-only" title="Zoom out" aria-label="Zoom out">&minus;</button>
        <button id="zoom-in" class="touch-only" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="fit">Fit</button>
        <button id="clear-focus">Clear</button>
      </div>

      <div class="overlay ov-controls" id="ov-controls">
        <button type="button" class="ov-toggle" id="ov-toggle" aria-expanded="true">Layout &amp; depth</button>
        <div class="lbl"><span>Depth</span><span id="depth-v">3 hops</span></div>
        <input id="depth" type="range" min="1" max="3" value="3">
        <div class="lbl"><span>Layout</span></div>
        <select id="layout">
          <option value="concentric">Concentric by community</option>
          <option value="stack">Agent Studio stack</option>
          <option value="force">Force directed</option>
          <option value="layered">Layered (flow)</option>
          <option value="radial">Radial by hop</option>
          <option value="grid">Grid by rank</option>
        </select>
        <div class="hint" id="layout-hint"></div>
      </div>
    </div>

    <aside class="side right" id="right-panel">
      <button class="panel-toggle right" id="toggle-right" title="Collapse panel (])" aria-expanded="true">›</button>
      <div class="side-body">
      <div class="rtabs" role="tablist">
        <button role="tab" data-rtab="node" aria-selected="true">Node</button>
        <button role="tab" data-rtab="neighbors" aria-selected="false">Neighbors</button>
        <button role="tab" data-rtab="bridges" aria-selected="false">Bridges</button>
        <button role="tab" data-rtab="hubs" aria-selected="false">Hubs</button>
      </div>
      <div class="rbody" id="rbody"></div>
      </div>
      <div class="rail-label">Details</div>
    </aside>
  </div>

  <div class="legend">
    <span class="title">Edges</span>
    <span class="lbl" id="legend-count"></span>
    <span class="chips" id="legend"></span>
    <button class="mini" id="legend-all">All on</button>
  </div>

  <div class="status">
    <span id="status-left"></span>
    <span class="credit" id="credit"></span>
    <span class="right" id="status-right"></span>
  </div>
</section>

<!-- ------------------------------------------------------------- data lab -->
<section id="lab" hidden>
  <div class="lab-bar">
    <input id="lab-q" type="text" placeholder="Filter by name, code, prompt text, JS source…" spellcheck="false">
    <label class="sel"><span>Layer</span>
      <select id="lab-layer"><option value="">all</option></select>
    </label>
    <label class="sel"><span>Kind</span>
      <select id="lab-type"><option value="">all</option></select>
    </label>
    <label class="sel"><span>Family</span>
      <select id="lab-family"><option value="">all</option></select>
    </label>
    <label class="sel"><span>Only</span>
      <select id="lab-flag">
        <option value="">everything</option>
        <option value="articulation">articulation points</option>
        <option value="issues">has findings</option>
        <option value="stub">referenced, not in repo</option>
        <option value="local">from my environment</option>
      </select>
    </label>
    <button class="mini" id="lab-csv">Export CSV</button>
    <span class="lbl" id="lab-count"></span>
  </div>

  <div class="lab-scroll">
    <table class="grid" id="lab-grid"></table>
  </div>

  <div class="tools">
    <div class="tool" id="tool-path"></div>
    <div class="tool" id="tool-impact"></div>
  </div>
</section>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
